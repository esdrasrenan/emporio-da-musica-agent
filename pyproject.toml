[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-da-musica-agent"
version = "0.1.0"
description = "Customer-service agent prototype for Empório da Música, a musical instrument store in Campo Grande/MS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "openai>=1.60",
    "pydantic>=2.7",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "holidays>=0.60",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
emporio = "emporio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]  # word lists read better as a split string
